experiment:
  name: custom_cflow_input_tiling_global
  seed: 42
  device: auto
  output_dir: ../runs
data:
  format: folders
  train_normal_dir: ../dataset/train/good
  test_normal_dir: ../dataset/test/good
  test_anomaly_dir: ../dataset/test/defect
  mask_dir: ../dataset/ground_truth/defect
  mask_suffix: _mask
  mask_extension: .png
  recursive: true
  image_size: null
  batch_size: 1
model:
  name: cflow
  backbone: wide_resnet50_2
  layers: [layer2, layer3, layer4]
  pretrained: true
input_tiling:
  enabled: true
  tile_size: [256, 256]
  stride: [256, 256]
  tile_resize: [256, 256]
  mode: padding
  remove_border_count: 0
tiled_ensemble:
  enabled: false
cflow:
  condition_vector: 128
  coupling_blocks: 8
  clamp_alpha: 1.9
  fiber_batch_size: 64
  tile_batch_size: 8
  learning_rate: 0.0001
  epochs: 10
evaluation:
  aupro_fpr_limit: 0.3
  aupro_thresholds: 200
  pixel_auroc_bins: 4096
  visualization:
    enabled: true
    image_threshold: null
    train_quantile: 0.99
    correct_anomalies: 5
    max_side: 1600
  fps_warmup: 2
  save_maps: false
  save_checkpoint: false
