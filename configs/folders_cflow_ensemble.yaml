experiment:
  name: custom_cflow_ensemble
  seed: 42
  device: auto
  output_dir: ../runs
data:
  format: folders
  train_normal_dir: ../dataset/train/good
  test_normal_dir: ../dataset/test/good
  test_anomaly_dir: ../dataset/test/defect
  mask_dir: ../dataset/ground_truth/defect
  mask_suffix: _mask
  mask_extension: .png
  recursive: true
  image_size: [512, 512]
  batch_size: 1
model:
  name: cflow
  backbone: wide_resnet50_2
  layers: [layer2, layer3, layer4]
  pretrained: true
input_tiling:
  enabled: false
tiled_ensemble:
  enabled: true
  tile_size: [256, 256]
  stride: [256, 256]
cflow:
  condition_vector: 128
  coupling_blocks: 8
  clamp_alpha: 1.9
  fiber_batch_size: 64
  learning_rate: 0.0001
  epochs: 10
