experiment:
  name: audiojack_c1_patchcore_input_tiling
  seed: 42
  device: auto
  output_dir: ../runs
data:
  format: real_iad
  root: D:/VinRobotics
  metadata: D:/VinRobotics/realiad_jsons/realiad_jsons_sv/audiojack.json
  category: audiojack
  camera: C1
  resolution: raw
  image_size: null  # Keep the source image and mask at their native size.
  batch_size: 1
  num_workers: 0
  strict_files: true
model:
  name: patchcore
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  pretrained: true
input_tiling:
  enabled: true
  tile_size: [512, 512]   # Raw-image pixels before the backbone.
  stride: [256, 256]
  tile_resize: [256, 256] # Network input per tile; equal to tile_size skips resize.
  mode: padding
  remove_border_count: 0
tiled_ensemble:
  enabled: false
patchcore:
  coreset_ratio: 0.1
  num_neighbors: 9
  tile_batch_size: 4       # Maximum tiles passed to the backbone per forward.
  embedding_storage: disk  # Temporary training embeddings are deleted after coreset selection.
  distance_bank_chunk_size: 4096
evaluation:
  aupro_fpr_limit: 0.3
  aupro_thresholds: 200
  fps_warmup: 2
  save_maps: false
  save_checkpoint: false
