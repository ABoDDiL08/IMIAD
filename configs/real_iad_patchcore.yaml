experiment:
  name: audiojack_c1_patchcore_input_tiling
  seed: 42
  device: auto
  output_dir: ../runs
data:
  format: real_iad
  root: D:/VinRobotics
  metadata: D:/VinRobotics/realiad_jsons/realiad_jsons_sv/audiojack.json
  category: audiojack
  camera: C1
  resolution: raw
  image_size: [512, 512]
  batch_size: 1
  num_workers: 0
  strict_files: true
model:
  name: patchcore
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  pretrained: true
input_tiling:
  enabled: true
  tile_size: [256, 256]
  stride: [256, 256]
  mode: padding
  remove_border_count: 0
tiled_ensemble:
  enabled: false
patchcore:
  coreset_ratio: 0.1
  num_neighbors: 9
evaluation:
  aupro_fpr_limit: 0.3
  aupro_thresholds: 200
  fps_warmup: 2
  save_maps: false
  save_checkpoint: false
